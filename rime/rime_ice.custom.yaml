# rime_ice.custom.yaml — 雾凇拼音 · LLM 候选词重排配置（Windows · v8 异步版）
# 放置路径：%APPDATA%\Rime\rime_ice.custom.yaml
# 修改后需重新部署
# v8 架构：击键路径零阻塞（文件握手），推理由 sidecar.py 在独立进程完成。
#   部署顺序：先启动 sidecar（不在击键路径），再启用本 filter。

patch:
  "translator/enable_completion": false   # 补全候选(~剩余拼音提示)不进候选，全拼打完才出词
  "engine/processors/@before 0": lua_processor@llm_retract_tracker
  # ── LLM 重排层（v8 异步文件握手）──
  "engine/filters/@next": lua_filter@llm_reranker

  # ── 上屏后联想（v1 查表）──
  "engine/processors/@before 1": lua_processor@predictor_processor
  "speller/alphabet": zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`'   # 追加撇号：上屏后联想触发码
  "engine/translators/@before 0": lua_translator@predictor_translator
  "switches/@next 0":
    name: ai_predict
    states: [ "联关", "联开" ]
    reset: 1
  "llm_reranker":
    enabled: true
    # RPC 目录（lua 与 sidecar.py --dir 必须一致）；缺省 = 用户目录/llm_rpc（纯 ASCII 时）
    # rpc_dir: "C:/Windows/Temp/llm_rpc"
    max_candidates: 9
    min_syllables: 2
    max_preedit_len: 10
    max_rerank_pos: 9
    resp_fresh_seconds: 3
    debug_log: true
    collect_training_data: true
    collect_user_pairs: true
    collect_llm_pairs: false
